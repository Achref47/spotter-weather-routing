# Render Blueprint for Spotter: a Django API (web service) and a Vite/React static site.
# Secrets and URLs are NOT stored here. Every `sync: false` variable is prompted for in the Render
# dashboard when the Blueprint is created. See docs/DEPLOYMENT.md for the exact values.
services:
  - type: web
    name: spotter-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker with threads keeps the in-memory throttle counters and weather/geocode caches in a
    # single process; several workers would each keep their own. The 120 s timeout covers a slow
    # cold analysis (Open-Meteo can take up to 60 s per attempt and is retried once).
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "false"
      # Must be at least 50 characters. Render's generateValue (44 characters) is too short for the
      # check in config/settings.py, so paste your own value (docs/DEPLOYMENT.md shows how).
      - key: DJANGO_SECRET_KEY
        sync: false
      # Hostname of this service only, without https:// (e.g. spotter-api.onrender.com).
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # Origin of the static site, with https:// and no trailing slash.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      # One proxy (Render's) sits in front of the app. Verify after deploying (docs/DEPLOYMENT.md).
      - key: NUM_PROXIES
        value: "1"

  - type: web
    name: spotter-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Vite 8 needs Node 20.19+ or 22.12+; this is the version the project was tested with.
      - key: NODE_VERSION
        value: 22.22.2
      # Origin of the API service, with https:// and no trailing slash. Baked in at build time.
      - key: VITE_API_URL
        sync: false
